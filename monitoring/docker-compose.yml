name: monitor

x-common-settings: &common
  environment:
    - TZ=${MY_TZ}
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
services:
  db:
    image: timescale/timescaledb:latest-pg15
    command: postgres -c max_connections=200 -c shared_buffers=512MB -c password_encryption=scram-sha-256
    container_name: postgres
    restart: always
    networks:
      - backend
    shm_size: 1gb
    environment:
      - POSTGRES_DB=${DB}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - ./zbx_db_data:/var/lib/postgresql/data
    <<: *common
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: pgbouncer
    restart: always
    networks:
      - backend
      - frontend
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASS}@db:5432/${DB}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=20
      - RESERVE_POOL_SIZE=10
      - ADMIN_USERS=${DB_USER}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - LISTEN_PORT=6432
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path

    depends_on:
      db:
        condition: service_healthy

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest 
    container_name: zabbix-server
    ports:
      - 10051:10051
    restart: always
    networks:
      - frontend
    environment:
      - DB_SERVER_HOST=pgbouncer
      - DB_SERVER_PORT=6432
      - POSTGRES_DB=${DB}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - ZBX_ENABLE_TIMESCALE_DB=true
    volumes:
      - ./zbx_mibs:/usr/lib/zabbix/mibs
      - ./zbx_externalscripts:/usr/lib/zabbix/externalscripts
      - ./prod/alerts/zbx_alertscripts:/usr/lib/zabbix/alertscripts
    <<: *common
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10051 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    ports:
      - 80:8080
    restart: always
    networks:
      - frontend
    environment:
      - DB_SERVER_HOST=pgbouncer
      - DB_SERVER_PORT=6432
      - POSTGRES_DB=${DB}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=${MY_TZ}
    <<: *common
    depends_on:
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/index.php || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    networks:
      - frontend
    environment:
      - ZBX_HOSTNAME=Zabbix server
      - ZBX_SERVER_HOST=zabbix-server
    <<: *common
    depends_on:
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "zabbix_agent2", "-t", "agente.ping"]
      interval: 0s
      timeout: 10s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - 3000:3000

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge